# Model config — 老师 Token Plan（OpenAI 兼容网关）
# Base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
# 文本可选: qwen3.8-max / qwen3.7-max / qwen3.7-plus / qwen3.6-flash
# 日常演示: plus；省额度/ABSA: flash；冲质量: max

main:
  provider: qwen
  model: qwen3.7-plus
  api_key_env: QWEN_APIKEY
  kwargs:
    temperature: 0.4
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

text_generation:
  provider: qwen
  model: qwen3.7-plus
  api_key_env: QWEN_APIKEY
  kwargs:
    temperature: 0.3
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

element_extraction:
  provider: qwen
  model: qwen3.6-flash
  api_key_env: QWEN_APIKEY
  kwargs:
    temperature: 0.1
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

code_generation:
  provider: qwen
  model: qwen3.6-flash
  api_key_env: QWEN_APIKEY
  kwargs:
    temperature: 0.2
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
