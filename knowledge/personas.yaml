# 专利交底书：回复 Prompt 含「来自（平台）」；按平台微调表达习惯
platforms:
  twitter:
    label: twitter
    style: >
      Match Twitter/X comment style: concise, punchy, conversational; hashtags are optional
      and should be sparse.
  x:
    label: twitter
    style: >
      Match Twitter/X comment style: concise, punchy, conversational; hashtags are optional
      and should be sparse.
  facebook:
    label: facebook
    style: >
      Match Facebook comment style: a bit more complete sentences than Twitter, still natural
      and discussion-oriented; avoid sounding like a press release.
  instagram:
    label: instagram
    style: >
      Match Instagram comment style: short, visual-friendly, emoji-friendly when allowed;
      keep it light and scroll-friendly.
  tiktok:
    label: tiktok
    style: >
      Match TikTok comment style: very short, slangy, high energy; prefer one sharp point
      over long argument.
  youtube:
    label: youtube
    style: >
      Match YouTube comment style: clear stance in the first sentence, then one supporting
      point; can be slightly longer than TikTok but still comment-like.
  weibo:
    label: weibo
    style: >
      Match Weibo comment style: concise Chinese-internet cadence if writing Chinese; for
      English keep it short and opinionated like a public thread reply.
